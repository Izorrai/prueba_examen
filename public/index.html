<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Aliens</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    
    
    <section class="panel">
      <h2>Nuevo Alien</h2>
      <form id="alienForm">
        <input type="text" id="nombre" placeholder="Nombre" required />
        <input type="text" id="planeta" placeholder="Planeta de origen" required />
        <select id="peligrosidad" required>
          <option value="">Nivel de Peligrosidad</option>
          <option value="Bajo">Bajo</option>
          <option value="Alto">Alto</option>
        </select>
        <button type="submit">Registrar</button>
      </form>
    </section>

    
    <section class="panel">
      <h2>Tarjetas Aliens</h2>
      <div id="alienList" class="cards"></div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
